name: release-asset-audit

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to audit
        required: true
        default: v0.9.1-preprint

permissions:
  contents: read

jobs:
  audit-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install audit environment
        run: python -m pip install -e .[test]
      - name: Download exact Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p downloaded-release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded-release-assets
      - name: Strict schema, checksum, membership, and privacy audit
        run: python scripts/audit_release.py --asset-root downloaded-release-assets --output release-audit-report.json
      - name: Repository-only headline replay
        run: pytest tests/test_headline_replay.py tests/test_artifact_schema.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-audit-report
          path: release-audit-report.json
