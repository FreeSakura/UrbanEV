name: public-artifact-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.scope.outputs.tests }}
      forecasting: ${{ steps.scope.outputs.forecasting }}
      papers: ${{ steps.scope.outputs.papers }}
      manuscript: ${{ steps.scope.outputs.manuscript }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - id: scope
        run: python scripts/ci_scope.py

  repository-quality:
    name: Documentation and evidence integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check public indexes and committed hashes
        run: |
          python scripts/repository.py check
          python scripts/repository.py verify-manifest
      - name: Verify deterministic indexes
        run: |
          python scripts/repository.py build
          git diff --exit-code -- results docs scripts/README.md

  # Keep the required check present even when only documentation changes.
  test-and-build:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.tests == 'true'
        with:
          python-version: "3.10"
          cache: pip
      - name: Install CPU forecasting environment
        if: needs.changes.outputs.forecasting == 'true'
        run: |
          python -m pip install 'torch>=2.4,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,research,evidence]'
      - name: Install base test environment
        if: needs.changes.outputs.tests == 'true' && needs.changes.outputs.forecasting != 'true'
        run: python -m pip install -e '.[test,evidence]'
      - name: Run the test suite once
        if: needs.changes.outputs.tests == 'true'
        run: pytest
      - name: CPU training example
        if: needs.changes.outputs.forecasting == 'true'
        run: python -m urbanev_forecast smoke --model innovation_attention --epochs 2 --output local-data/ci-smoke
      - name: Verify generated manifests
        if: needs.changes.outputs.tests == 'true'
        run: |
          python scripts/build_model_source_manifest.py
          python scripts/build_manifest.py
          git diff --exit-code artifacts/manifest.json artifacts/manifests models/MODEL_SOURCE_MANIFEST.csv
      - name: Install LaTeX
        if: needs.changes.outputs.papers == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra poppler-utils
      - name: Build paper variants
        if: needs.changes.outputs.papers == 'true'
        run: |
          python scripts/build_paper.py --variant main
          python scripts/build_paper.py --variant supplement
          python scripts/build_paper.py --variant archive
          python scripts/build_historical_archive.py
      - name: Verify PDF text, pages, fonts and attribution
        if: needs.changes.outputs.papers == 'true'
        run: python scripts/verify_paper_manifest.py
      - name: Report selected scope
        env:
          TESTS: ${{ needs.changes.outputs.tests }}
          FORECASTING: ${{ needs.changes.outputs.forecasting }}
          PAPERS: ${{ needs.changes.outputs.papers }}
          MANUSCRIPT: ${{ needs.changes.outputs.manuscript }}
        run: echo "tests=$TESTS forecasting=$FORECASTING papers=$PAPERS manuscript=$MANUSCRIPT"

  current-manuscript:
    name: Current Word manuscript
    needs: changes
    if: needs.changes.outputs.manuscript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Word and figure tools
        run: |
          python -m pip install -e '.[manuscript]'
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils
          curl -fsSL --retry 2 https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz -o "$RUNNER_TEMP/pandoc.tar.gz"
          tar -xzf "$RUNNER_TEMP/pandoc.tar.gz" -C "$RUNNER_TEMP"
      - name: Rebuild current figures and check frozen figure data
        run: |
          python scripts/build_persistent_event_figures.py --output "$RUNNER_TEMP/persistent-event/figures"
          python -c "import json,os,pathlib; a=json.loads(pathlib.Path('paper/persistent_events/figures/figure_data.json').read_text()); b=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'persistent-event/figures/figure_data.json').read_text()); assert a==b, 'Figure data drift'"
      - name: Build editable Word with native equations
        run: |
          python scripts/build_persistent_event_manuscript.py --pandoc "$RUNNER_TEMP/pandoc-3.11/bin/pandoc" --resource-root "$RUNNER_TEMP/persistent-event" --output "$RUNNER_TEMP/persistent-event/WORD_MANUSCRIPT.docx"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: persistent-event-word-manuscript
          path: ${{ runner.temp }}/persistent-event/WORD_MANUSCRIPT.docx
