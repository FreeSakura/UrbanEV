[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanev-forecast"
version = "0.10.0"
description = "Research tools for state-of-the-art multivariate EV charging forecasting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "FreeSakura"}]
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "PyYAML>=6,<7", "tomli>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "pypdf>=4", "reportlab>=4", "threadpoolctl>=3,<4"]
research = ["torch>=2.4,<3", "einops>=0.8,<1", "reformer-pytorch>=1.4,<2", "threadpoolctl>=3,<4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
