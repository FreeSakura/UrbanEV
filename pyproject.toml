[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanev-forecast"
version = "0.10.0"
description = "Persistent-event structure and evaluation under partial observations, with archived UrbanEV research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "FreeSakura"}]
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "PyYAML>=6,<7", "tomli>=2,<3"]

[project.urls]
Repository = "https://github.com/FreeSakura/UrbanEV"
Documentation = "https://github.com/FreeSakura/UrbanEV/tree/main/paper/persistent_events"
Issues = "https://github.com/FreeSakura/UrbanEV/issues"

[project.optional-dependencies]
# The archived PDF text hashes use this extractor version.
test = ["pytest>=8", "pypdf==6.16.2", "reportlab>=4", "threadpoolctl>=3,<4"]
research = ["torch>=2.4,<3", "einops>=0.8,<1", "reformer-pytorch>=1.4,<2", "threadpoolctl>=3,<4"]
evidence = ["scikit-learn>=1.5,<2", "scipy>=1.11,<2", "numba>=0.60,<1", "matplotlib>=3.8,<4", "threadpoolctl>=3,<4"]
manuscript = ["python-docx>=1.1,<2", "reportlab>=4", "Pillow>=10", "pdf2image>=1.17"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
